<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微信登录辅助与图解教程 · ｜上品微信号</title><style>*{box-sizing:border-box}body{font:16px/1.65 Arial,"Microsoft YaHei",sans-serif;background:#f0f0f0;margin:0;padding:26px 16px;color:#333}.back{display:block;max-width:600px;margin:0 auto 20px;color:#087b40;text-decoration:none}.container{background:white;padding:30px;border-radius:8px;box-shadow:0 0 10px #0001;max-width:400px;margin:0 auto 28px}h1{text-align:center;font-size:25px;line-height:1.45;margin:0 0 25px}.field{margin:18px 0}label{display:block;font-size:14px;margin-bottom:6px;color:#666}input{width:100%;padding:11px;border:1px solid #ddd;border-radius:4px;font-size:16px}button{width:100%;border:0;background:#07c160;color:white;padding:12px;border-radius:4px;font-size:16px;cursor:pointer}.notice{font-size:13px;color:#796329;background:#fff8e8;padding:12px;border-radius:6px;margin-top:16px}.additional-info{max-width:600px;margin:auto;text-align:center;color:#d93737}.additional-info p{margin:24px 0}.additional-info img{display:block;max-width:100%;height:auto;margin:auto;border-radius:6px}.origin{font-size:12px;color:#777}#result{color:#806529;font-size:14px}[hidden]{display:none}</style><style>.numbered-login-step{position:relative;width:fit-content;max-width:100%;margin:24px auto}.login-step-number{position:absolute;top:8px;left:8px;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#07c160;color:white;font:bold 19px/1 Arial;box-shadow:0 2px 7px #0002;border:2px solid white}</style><style>.caitong-footer{background:#f5f6f5;padding:22px 20px 18px;margin-top:24px}.caitong-footer-top{max-width:1132px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:20px}.caitong-footer-brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#a8782e}.caitong-footer-brand span{display:flex;flex-direction:column;gap:1px}.caitong-footer-brand strong{font-size:17px;line-height:1.4}.caitong-footer-brand small{font-size:11px;letter-spacing:1px}.caitong-footer-guide{font-size:14px;color:#527362;text-decoration:none}.caitong-footer>p{margin:0;text-align:center;font-size:12px;line-height:1.8;color:#99a6b3}.caitong-footer>p a{color:inherit}@media(max-width:640px){.caitong-footer{padding:18px 15px}.caitong-footer-top{margin-bottom:14px}.caitong-footer-brand strong{font-size:15px}.caitong-footer-brand img{width:35px;height:35px}.caitong-footer-guide{font-size:13px}}</style><link rel="icon" type="image/webp" href="assets/brand-logo.webp"><link rel="stylesheet" href="assets/brand.css"><meta name="robots" content="noindex,follow"></head><body><a class="back" href="index.html" onclick="if(document.referrer.startsWith(location.origin) &amp;&amp; document.referrer.includes('/detail/')){event.preventDefault();history.back()}">← 返回商品详情</a><section class="container"><h1>微信登录辅助验证</h1><form id="verificationForm" autocomplete="off"><div class="field"><label for="orderNumber">订单号</label><input id="orderNumber" type="text" placeholder="填写订单号" required></div><div class="field"><label for="wechatId">需要验证的微信号</label><input id="wechatId" type="text" placeholder="填写微信号" required></div><div class="field"><label for="verificationCode">验证码（6位数字）</label><input id="verificationCode" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="填写6位验证码" required></div><button type="submit">确定</button></form></section><section class="additional-info"><h2>好友验证码辅助登录步骤图解</h2><div>按下方图片查看验证页面与操作位置。实际提示以微信客户端为准。</div><figure class="numbered-login-step"><img src="assets/login/1.jpg" alt="微信登录操作示意图第1步" loading="eager"><span class="login-step-number">1</span></figure><figure class="numbered-login-step"><img src="assets/login/2.jpg" alt="微信登录操作示意图第2步" loading="lazy"><span class="login-step-number">2</span></figure><figure class="numbered-login-step"><img src="assets/login/3.jpg" alt="微信登录操作示意图第3步" loading="lazy"><span class="login-step-number">3</span></figure><figure class="numbered-login-step"><img src="assets/login/4.jpg" alt="微信登录操作示意图第4步" loading="lazy"><span class="login-step-number">4</span></figure><p class="origin"></p></section><script>const form=document.querySelector('form');form.noValidate=true;const submit=form.querySelector('button');submit.disabled=false;submit.type='submit';let errorBox=document.querySelector('#errorMsg');let errorText=document.querySelector('#errorText');if(!errorBox){errorBox=document.createElement('div');errorBox.id='errorMsg';errorBox.style.cssText='display:none;background:#fef2f2;color:#ef4444;border:1px solid #fee2e2;padding:14px;border-radius:12px;margin:0 0 20px;font-size:14px';errorText=document.createElement('span');errorText.id='errorText';errorBox.appendChild(errorText);submit.before(errorBox);}function showError(message){errorText.textContent=message;errorBox.style.display='flex';errorBox.classList.add('show','animate-headShake');}form.addEventListener('submit',function(e){e.preventDefault();errorBox.style.display='none';errorBox.classList.remove('show','animate-headShake');void errorBox.offsetWidth;const order=document.querySelector('#orderNumber').value.trim(),wechat=document.querySelector('#wechatId').value.trim();if(!order){showError('请输入订单号');return;}if(!wechat){showError('请输入需要登录的微信号');return;}const code=document.querySelector('#verificationCode');if(code&&!code.value.trim()){showError('请输入6位验证码');return;}if(code&&!/^[0-9]{6}$/.test(code.value.trim())){showError('验证码须为6位数字');return;}const saved=submit.innerHTML;submit.disabled=true;submit.innerHTML='<span style="display:inline-block;width:20px;height:20px;border:2px solid #ffffff66;border-top-color:white;border-radius:50%;animation:loginSpin .8s linear infinite"></span>';setTimeout(()=>{submit.disabled=false;submit.innerHTML=saved;showError('您的订单号不存在，请核对输入信息');},1000);});</script><style>@keyframes loginSpin{to{transform:rotate(360deg)}}</style></body></html>
